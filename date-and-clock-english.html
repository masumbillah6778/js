<style>
  .clock {
    font-size: 22px;
    font-weight: 700;
    white-space: nowrap;
}

.date-part {
    color: #00e5ff;
}

.time-part {
    color: #ffd54f;
}

.separator {
    color: #fff;
    margin: 0 14px;
}
</style>

<div class="clock">
    <span id="englishDate" class="date-part"></span>
    <span class="separator"> । </span>
    <span id="englishTime" class="time-part"></span>
</div>

<script>
function updateEnglishClock() {
    const now = new Date();

    const day = String(now.getDate()).padStart(2, "0");
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const year = now.getFullYear();

    let hour = now.getHours();
    const minute = String(now.getMinutes()).padStart(2, "0");
    const second = String(now.getSeconds()).padStart(2, "0");

    const ampm = hour >= 12 ? "PM" : "AM";

    hour = hour % 12;
    hour = hour || 12;
    hour = String(hour).padStart(2, "0");

    document.getElementById("englishDate").textContent =
        `${day}-${month}-${year}`;

    document.getElementById("englishTime").textContent =
        `${hour}:${minute}:${second} ${ampm}`;
}

updateEnglishClock();
setInterval(updateEnglishClock, 1000);
</script>
